summary: >
  Against a no-reform baseline, Germany's subsidised retirement account draws about EUR 9bn a year by 2030, half of it re-labelled Riester and fund saving and only EUR 1bn new household saving; savers gain from lower costs, providers lose margin, and the larger pool of capital is the proposed Kapitalrente, not the depot.

